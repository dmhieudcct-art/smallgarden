<!DOCTYPE html>
<html class="light" lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="bg-[#B8D8F8] text-on-surface font-body-md">
  {% include header.html %}
  <main class="pt-40 max-w-[1400px] mx-auto relative min-h-screen bg-[#B8D8F8]">
    <!-- Sidebar Pattern Left -->
    <div class="hidden xl:block fixed left-0 top-0 bottom-0 w-[calc((100vw-1100px)/2)] bg-[#B8D8F8] z-30 overflow-hidden">
      <div class="w-full h-full"></div>
    </div>
    <!-- Sidebar Pattern Right -->
    <div class="hidden xl:block fixed right-0 top-0 bottom-0 w-[calc((100vw-1100px)/2)] bg-[#B8D8F8] z-30 overflow-hidden">
      <div class="w-full h-full"></div>
    </div>
    <!-- Central White Container -->
    <div class="max-w-container-max-width mx-auto bg-white px-margin-mobile md:px-margin-desktop py-12 shadow-xl relative z-10 min-h-screen z-40">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
