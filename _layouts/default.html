<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}

  <div class="page-margins">

    <!-- Left botanical margin -->
    <div class="margin-botanical margin-botanical--left" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 500" fill="none" class="botanical-svg">
        <!-- Stem curves upward -->
        <path d="M56 498 C54 420 50 325 56 235 C61 165 68 95 78 18"
              stroke="#E8A8B8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.72"/>
        <!-- Leaf R1 -->
        <path d="M57 430 C82 418 90 394 74 384 C68 406 57 430 57 430Z"
              fill="#E8A8B8" opacity="0.62"/>
        <!-- Leaf L1 -->
        <path d="M55 368 C30 356 22 332 38 322 C48 344 55 368 55 368Z"
              fill="#E8A8B8" opacity="0.62"/>
        <!-- Leaf R2 -->
        <path d="M57 298 C82 284 88 260 72 250 C66 272 57 298 57 298Z"
              fill="#E8A8B8" opacity="0.55"/>
        <!-- Leaf L2 -->
        <path d="M55 228 C30 216 24 192 42 182 C51 204 55 228 55 228Z"
              fill="#E8A8B8" opacity="0.55"/>
        <!-- Leaf R3 small -->
        <path d="M62 155 C82 142 86 120 72 112 C67 132 62 155 62 155Z"
              fill="#E8A8B8" opacity="0.45"/>
        <!-- Leaf L3 small -->
        <path d="M59 90 C38 79 33 60 47 52 C54 68 59 90 59 90Z"
              fill="#E8A8B8" opacity="0.40"/>
        <!-- Bud -->
        <ellipse cx="80" cy="14" rx="5" ry="8"
                 fill="#E8A8B8" opacity="0.48" transform="rotate(22 80 14)"/>
      </svg>
    </div>

    <!-- Central content panel -->
    <div class="page-panel">
      <main class="site-main">
        {{ content }}
      </main>
    </div>

    <!-- Right botanical margin -->
    <div class="margin-botanical margin-botanical--right" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 500" fill="none" class="botanical-svg">
        <!-- Stem curves downward from top -->
        <path d="M54 2 C56 80 60 175 54 265 C49 335 42 405 32 482"
              stroke="#E8A8B8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.72"/>
        <!-- Leaf L1 -->
        <path d="M53 72 C28 84 20 108 36 118 C46 96 53 72 53 72Z"
              fill="#E8A8B8" opacity="0.45"/>
        <!-- Leaf R1 -->
        <path d="M55 140 C80 152 88 176 72 186 C62 164 55 140 55 140Z"
              fill="#E8A8B8" opacity="0.52"/>
        <!-- Leaf L2 -->
        <path d="M53 212 C28 224 20 248 36 258 C46 236 53 212 53 212Z"
              fill="#E8A8B8" opacity="0.55"/>
        <!-- Leaf R2 -->
        <path d="M55 284 C80 296 86 320 70 330 C62 308 55 284 55 284Z"
              fill="#E8A8B8" opacity="0.62"/>
        <!-- Leaf L3 -->
        <path d="M52 354 C27 364 20 386 36 395 C46 375 52 354 52 354Z"
              fill="#E8A8B8" opacity="0.62"/>
        <!-- Leaf R3 small -->
        <path d="M49 418 C68 428 74 448 60 456 C54 438 49 418 49 418Z"
              fill="#E8A8B8" opacity="0.55"/>
      </svg>
    </div>

  </div><!-- .page-margins -->

  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
