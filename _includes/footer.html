{% assign lang = page.lang | default: 'en' %}

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand-group">
      <span class="footer-signature">{{ site.title }}</span>
      <p class="footer-tagline">
        {% if lang == 'vi' %}Nuôi dưỡng suy nghĩ từng chút một{% else %}Nurturing thoughts slowly{% endif %}
      </p>
    </div>
    <span class="footer-copy">
      {% if lang == 'vi' %}Được tạo bằng Jekyll · GitHub Pages{% else %}Built with Jekyll · GitHub Pages{% endif %}
    </span>
  </div>
</footer>
